spring.application.name=docente
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.profiles.active=local
server.port=${PORT:8081}

# Base compartida: tu propio historial de migraciones para no chocar con otros
spring.flyway.table=flyway_historial_docente
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.config.import=optional:file:./src/main/resources/application-local.properties

# T-199: Swagger UI y documento OpenAPI del módulo Docente
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# T-307: orígenes permitidos por CORS. En despliegue se sobreescribe con la
# variable APP_CORS_ORIGENES (lista separada por comas).
app.cors.origenes=http://localhost:5173
# T-307: URL que muestra Swagger UI en el selector de servidores.
app.openapi.servidor=http://localhost:8081
