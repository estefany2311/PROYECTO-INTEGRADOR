spring.application.name=estudiante
spring.datasource.url=jdbc:postgresql://ep-raspy-bird-b8uxg9cv-pooler.c-14.us-east-1.aws.neon.tech/plataforma_educativa?sslmode=require&channel_binding=require
spring.jpa.hibernate.ddl-auto=validate
spring.profiles.active=local
server.port=8082
# Flyway crea solo las tablas del módulo estudiante.
# Usa su propia tabla de historial para no chocar con la del backend docente en la base compartida.
spring.flyway.enabled=true
spring.flyway.table=flyway_historial_estudiante
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Duración de la sesión del estudiante en la tablet
estudiante.sesion.horas=8
# T-203: despues de 5 PIN incorrectos seguidos la cuenta se bloquea 2 minutos
estudiante.login.max-intentos=5
estudiante.login.minutos-bloqueo=2
